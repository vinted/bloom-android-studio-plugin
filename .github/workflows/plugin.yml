name: Android Studio plugin

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'bloom-plugin-v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build plugin
        run: ./gradlew test buildPlugin

  publish:
    name: Publish to JetBrains Marketplace
    if: startsWith(github.ref, 'refs/tags/bloom-plugin-v')
    needs: build
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          plugin_version="$(./gradlew properties --quiet | sed -n 's/^version: //p')"
          expected_tag="bloom-plugin-v${plugin_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag '$RELEASE_TAG' does not match plugin version '$plugin_version' (expected '$expected_tag')." >&2
            exit 1
          fi

      - name: Publish signed plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
